name: Enterprise security baseline
on:
  push:
    branches: ['develop/enterprise-security-automation']
    paths: ['Enterprise-Security-Automation/**', '.github/workflows/enterprise-security-baseline.yml']
  pull_request:
    branches: ['develop/enterprise-security-automation']
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s Enterprise-Security-Automation/tests -v
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform validation
        working-directory: Enterprise-Security-Automation/infrastructure/aws
        run: |
          terraform init -backend=false
          terraform validate
      - name: Scan infrastructure
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Enterprise-Security-Automation/infrastructure/aws
          format: json
          output: trivy.json
          exit-code: '0'
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --disable-pip-version-check semgrep==1.185.0
      - name: Scan application source (SAST)
        run: |
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --config Enterprise-Security-Automation/security/semgrep-rules.yml --metrics=off --disable-version-check --strict --json --output semgrep.json Enterprise-Security-Automation
      - name: Scan dependencies (SCA)
        run: |
          trivy fs --scanners vuln --list-all-pkgs --format json --output sca.json --exit-code 0 Enterprise-Security-Automation
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" || $2 == "*gitleaks_8.30.1_linux_x64.tar.gz" {print; n++} END {if (n != 1) exit 1}' gitleaks_8.30.1_checksums.txt | sha256sum --check -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan current project tree for secrets
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" dir Enterprise-Security-Automation --redact=100 --report-format json --report-path gitleaks.json --exit-code 0 --no-banner
      - name: Evaluate expanded security checks
        run: python3 Enterprise-Security-Automation/security/expanded_gate.py semgrep.json sca.json gitleaks.json expanded-gate.json
      - name: Checkout trusted review code
        if: github.event.pull_request != null
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-review
          persist-credentials: false
      - name: Verify human approvals
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PR: ${{ github.event.pull_request != null }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            python3 trusted-review/Enterprise-Security-Automation/security/verify_reviews.py
          else
            python3 Enterprise-Security-Automation/security/verify_reviews.py
          fi
      - name: Evaluate gate
        if: success()
        run: python3 Enterprise-Security-Automation/security/gate.py trivy.json Enterprise-Security-Automation/governance/requirements.example.json gate.json
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: |
            trivy.json
            gate.json
            review-evidence.json
            semgrep.json
            sca.json
            gitleaks.json
            expanded-gate.json
          retention-days: 14
